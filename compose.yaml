services:
  wordpress:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-local-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_ENVIRONMENT_TYPE: local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/wp-includes/version.php"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - wordpress:/var/www/html
      - type: bind
        source: ./wp-content/themes/hochschulwatch
        target: /var/www/html/wp-content/themes/hochschulwatch
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./wp-content/plugins/hochschulwatch-mailabsender
        target: /var/www/html/wp-content/plugins/hochschulwatch-mailabsender
        read_only: true
        bind:
          create_host_path: false
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-local-wordpress}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    volumes:
      - db:/var/lib/mysql

volumes:
  wordpress:
  db:
